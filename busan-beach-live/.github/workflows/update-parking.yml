name: Update Parking

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: beach-data-update
  cancel-in-progress: false

jobs:
  update-parking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch official parking data
        run: node scripts/fetch-parking.js
        env:
          PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
      - name: Commit updated parking data
        run: |
          if git diff --quiet -- data/parking.json; then
            echo "No parking changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parking.json
          git commit -m "Update parking data"
          git pull --rebase origin main
          git push origin main
