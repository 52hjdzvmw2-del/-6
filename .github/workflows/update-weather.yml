name: Update Weather

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: beach-data-update
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check KMA API DNS
        run: getent hosts apis.data.go.kr || true
      - name: Check KMA API HTTPS connectivity
        run: curl -I --connect-timeout 20 --max-time 30 https://apis.data.go.kr/ || true
      - name: Check KMA API IPv4 connectivity
        run: curl -4 -I --connect-timeout 20 --max-time 30 https://apis.data.go.kr/ || true
      - name: Fetch official KMA weather data
        run: node scripts/fetch-weather.js
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      - name: Commit updated weather data
        run: |
          if git diff --quiet -- data/weather.json; then
            echo "No weather changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git commit -m "Update weather data"
          git pull --rebase origin main
          git push origin main
